services:
  dev:
    image: fenix-base:local
    container_name: example
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - example-home:/home/dev
      - ./mise.toml:/home/dev/mise.toml:ro
      - ./mise.lock:/home/dev/mise.lock:ro
      # If your capsule uses pypi: tools, also mount their hash-locked uv
      # lockfiles so installs are reproducible and checksum-verified:
      # - ./.mise/locks:/home/dev/.mise/locks:ro
      # Welcome text, option 2 (rich): mount a plain text file, printed
      # verbatim at login (never executed). Multi-line is fine.
      # - ./welcome.txt:/home/dev/.capsule-welcome:ro
      # Repos, option 2 (manifest): mount a file for per-repo dir/branch.
      # - ./repos.txt:/home/dev/.capsule-repos:ro
      # AWS config, option 2 (mounted file): mount your own prewritten,
      # non-secret ~/.aws/config read-only. Takes precedence over the
      # AWS_SSO_* env vars below; you then only run `aws sso login` — no
      # `aws configure sso`.
      # - ./your-aws-config:/home/dev/.aws/config:ro
    # Keyring password: the first shell asks for it. For unattended unlock,
    # uncomment this and the top-level `secrets:` below. The password then
    # lives on the host in ./keyring_password (keep it out of git).
    # secrets:
    #   - keyring_password
    environment:
      CAPSULE_NAME: "example"
      # Trust the mounted mise.toml and provision on start. A mise.toml runs
      # code ([env], hooks), so set this only for one you have reviewed.
      # Without it, run `mise trust ~/mise.toml && provision.sh` once.
      CAPSULE_TRUST_MISE: "1"
      GIT_USER_NAME: "Ada Lovelace"
      GIT_USER_EMAIL: "ada@example.com"
      # Welcome text, option 1 (simple): a one-line banner shown at login.
      CAPSULE_WELCOME: "Example capsule — a minimal, declarative dev environment."
      # Repos, option 1 (simple): space-separated owner/repo cloned into
      # ~/workspace by `capsule-sync` (run it after `gh auth login`).
      # CAPSULE_REPOS: "NordHero/fenix-images"
      # AWS SSO, option 1 (simple): non-secret identifiers only. When set on a
      # fresh volume (and no ~/.aws/config is mounted), the entrypoint seeds
      # ~/.aws/config so you only run `aws sso login` — no `aws configure sso`.
      # Placeholders; fill with your org's values.
      # AWS_SSO_SESSION: "my-sso"
      # AWS_SSO_START_URL: "https://my-org.awsapps.com/start"
      # AWS_SSO_REGION: "eu-west-1"
      # AWS_SSO_ACCOUNT_ID: "123456789012"
      # AWS_SSO_ROLE_NAME: "DeveloperAccess"
      # AWS_REGION: "eu-west-1"
      # AWS_PROFILE: "default"
      # AWS_DEFAULT_OUTPUT: "json"
volumes:
  example-home:
# secrets:
#   keyring_password:
#     file: ./keyring_password
