# A capsule declares its tools here. On first boot, mise installs them into
# the capsule's home volume and pins exact versions in mise.lock.
#
# This example is intentionally minimal — just enough to show the model: one
# declared tool, installed and locked. Richer, real-world toolsets (languages,
# IaC, CLIs, coding agents via EXTRA_TOOLS) belong in your own capsule
# definitions, not in this public example.

[tools]
# uv manages Python itself (`uv python install`, `uv run`), so a single entry
# covers the common Python workflow without pinning a separate interpreter.
uv = "0.13.0"
