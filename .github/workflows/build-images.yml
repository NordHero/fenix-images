name: build-images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      example: ${{ steps.diff.outputs.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            echo "example=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$files"
          code=false
          example=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md | docs/* | LICENSE | .github/dependabot.yml) ;;
              *) code=true ;;
            esac
            case "$f" in
              example/* | base/* | Dockerfile | extra-tools.sh | build-images.sh | .github/workflows/build-images.yml | .github/workflows/verify-example.yml) example=true ;;
            esac
          done <<<"$files"
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "example=$example" >>"$GITHUB_OUTPUT"

  validate-config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Validate example mise.toml syntax
        run: |
          set -ex
          cd example
          mise trust mise.toml
          mise config get --file mise.toml >/dev/null
          mise ls --current >/dev/null
          if grep -nE '=[[:space:]]*"latest"' mise.toml; then
            echo "pin every [tools] version" >&2
            exit 1
          fi

      - name: Check example mise.lock is current
        run: |
          set -ex
          cd example
          mise lock
          git diff --exit-code mise.lock .mise/locks
          test -z "$(git status --porcelain .mise/locks)"

  build:
    needs: validate-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build base image
        run: |
          docker build \
            --build-arg "IMAGE_VERSION=ci" \
            --build-arg "SOURCE_COMMIT=$(git rev-parse --short HEAD)" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t fenix-base:ci .

      - name: Verify base image contents + non-root
        run: |
          docker run --rm --entrypoint bash fenix-base:ci -lc '
            set -ex
            test "$(id -u)" -eq 1000
            curl --version
            git --version
            gh --version
            zsh --version
            mise --version
            test -d /opt/devbox-skel/.oh-my-zsh-custom/themes/powerlevel10k
            test -d /opt/devbox-skel/.oh-my-zsh
            test ! -d /usr/local/share/fonts/MesloLGS-NF
            test -x /usr/local/bin/extra-tools.sh
            test -x /usr/local/bin/capsule-sync
            test -x /usr/local/bin/capsule-info
            test -x /usr/local/bin/capsule-unlock
            test ! -e /usr/share/dbus-1/services/org.freedesktop.secrets.service
            test -s /etc/capsule/info.json
            grep -q "\"source_commit\"" /etc/capsule/info.json
            test -n "$CAPSULE_INFO"
          '

      - name: Verify OCI provenance labels
        run: |
          set -ex
          docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' fenix-base:ci | grep -qv '^$'
          docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' fenix-base:ci | grep -q '^ci$'

      - name: Verify entrypoint runs and reaches steady state
        run: |
          set -ex
          docker run -d --name fenix-ep \
            -e GIT_USER_NAME="CI" \
            -e GIT_USER_EMAIL="ci@test" \
            fenix-base:ci
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' fenix-ep)" = "true"
          docker exec fenix-ep bash -lc '
            set -ex
            test -f "$HOME/.keyring-env"
            test -f "$HOME/.zshrc"
            test -d "$HOME/workspace"
            test -d "$HOME/.oh-my-zsh"
            test "$(cat /proc/1/comm)" = "tini"
            test -z "$(grep -l "^State:.*Z" /proc/[0-9]*/status 2>/dev/null)"
          '
          for i in $(seq 1 20); do
            h="$(docker inspect -f '{{.State.Health.Status}}' fenix-ep)"
            test "$h" = "healthy" && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' fenix-ep)" = "healthy"
          docker rm -f fenix-ep

      - name: Verify keyring password (fresh, restart, wrong, legacy, secret file)
        run: |
          set -ex
          ex() { c="$1"; shift; docker exec -i "$c" bash -lc "$*"; }
          lookup() { ex "$1" '. ~/.keyring-env; secret-tool lookup svc ci' || true; }
          up() { docker run -d --name "$1" -e GIT_USER_NAME=CI -e GIT_USER_EMAIL=ci@test "${@:2}" fenix-base:ci; sleep 3; }
          restart() { docker restart "$1"; sleep 3; }

          up fenix-kr
          if ex fenix-kr capsule-unlock --status; then exit 1; fi
          if ex fenix-kr 'gh auth login --with-token </dev/null'; then exit 1; fi
          ex fenix-kr 'test ! -f ~/.config/gh/hosts.yml'
          if printf '\n\n' | ex fenix-kr capsule-unlock; then exit 1; fi
          printf 'pw1\npw1\n' | ex fenix-kr capsule-unlock
          ex fenix-kr capsule-unlock --status
          ex fenix-kr '. ~/.keyring-env; printf v1 | secret-tool store --label=ci svc ci'
          restart fenix-kr
          if ex fenix-kr capsule-unlock --status; then exit 1; fi
          test -z "$(lookup fenix-kr)"
          if printf 'x\ny\nz\n' | ex fenix-kr capsule-unlock; then exit 1; fi
          printf 'pw1\n' | ex fenix-kr capsule-unlock
          test "$(lookup fenix-kr)" = "v1"
          docker rm -f fenix-kr

          up fenix-leg
          ex fenix-leg '. ~/.keyring-env; eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"; sleep 1; printf old | secret-tool store --label=ci svc ci'
          restart fenix-leg
          printf 'n\n' | ex fenix-leg capsule-unlock
          test "$(lookup fenix-leg)" = "old"
          restart fenix-leg
          printf 'y\npw2\npw2\n' | ex fenix-leg capsule-unlock
          ex fenix-leg capsule-unlock --status
          test -z "$(lookup fenix-leg)"
          restart fenix-leg
          printf 'pw2\n' | ex fenix-leg capsule-unlock
          docker rm -f fenix-leg

          printf 'pw3\n' >/tmp/keyring_password
          chmod 644 /tmp/keyring_password
          up fenix-sec -v /tmp/keyring_password:/run/secrets/keyring_password:ro
          ex fenix-sec capsule-unlock --status
          restart fenix-sec
          ex fenix-sec capsule-unlock --status
          docker rm -f fenix-sec

      - name: Verify capsule-sync (clone, idempotent skip, graceful failure)
        run: |
          docker run --rm --entrypoint bash fenix-base:ci -lc '
            set -ex
            export CAPSULE_WORKSPACE="$HOME/ws" CAPSULE_REPOS_FILE="$HOME/none"

            # Clone a small public repo.
            CAPSULE_REPOS="octocat/Hello-World" capsule-sync
            test -d "$HOME/ws/Hello-World/.git"

            # Idempotent: second run skips the existing checkout.
            out="$(CAPSULE_REPOS="octocat/Hello-World" capsule-sync)"
            printf "%s\n" "$out" | grep -q "Hello-World: skipped"

            # Malformed entry fails gracefully (non-zero, clear message).
            if CAPSULE_REPOS="not-a-repo" capsule-sync; then exit 1; fi
          '

      - name: Verify AWS SSO config seeding (writes from env; no-op otherwise)
        run: |
          set -ex
          docker run -d --name fenix-aws \
            -e GIT_USER_NAME="CI" -e GIT_USER_EMAIL="ci@test" \
            -e AWS_SSO_SESSION="ci-sso" \
            -e AWS_SSO_START_URL="https://example.awsapps.com/start" \
            -e AWS_SSO_REGION="eu-west-1" \
            -e AWS_SSO_ACCOUNT_ID="123456789012" \
            -e AWS_SSO_ROLE_NAME="CIRole" \
            -e AWS_PROFILE="ci" \
            fenix-base:ci
          sleep 3
          docker exec fenix-aws bash -lc '
            set -ex
            test -f "$HOME/.aws/config"
            grep -q "\[sso-session ci-sso\]" "$HOME/.aws/config"
            grep -q "sso_start_url = https://example.awsapps.com/start" "$HOME/.aws/config"
            grep -q "\[profile ci\]" "$HOME/.aws/config"
            grep -q "sso_account_id = 123456789012" "$HOME/.aws/config"
          '
          docker rm -f fenix-aws

          docker run -d --name fenix-noaws \
            -e GIT_USER_NAME="CI" -e GIT_USER_EMAIL="ci@test" \
            fenix-base:ci
          sleep 3
          docker exec fenix-noaws bash -lc 'test ! -f "$HOME/.aws/config"'
          docker rm -f fenix-noaws

      - name: Verify mise trust and single-tool provisioning (both mechanisms)
        run: |
          set -ex
          printf '%s\n' '[tools]' 'uv = "latest"' '' '[env]' 'EXTRA_TOOLS = "kiro-cli"' > /tmp/ci-mise.toml
          docker run -d --name fenix-prov \
            -e GIT_USER_NAME="CI" \
            -e GIT_USER_EMAIL="ci@test" \
            -v "/tmp/ci-mise.toml:/home/dev/mise.toml:ro" \
            fenix-base:ci
          for i in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Running}}' fenix-prov)" = "true" && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Running}}' fenix-prov)" = "true"
          docker exec fenix-prov bash -lc '
            set -ex
            mise trust "$HOME/mise.toml"
            eval "$(mise activate bash)"
            mise ls --current >/dev/null
            mise install --yes
            uv --version
          '
          docker exec -e EXTRA_TOOLS="kiro-cli" fenix-prov bash -lc '
            set -ex
            extra-tools.sh
            command -v kiro-cli
            kiro-cli --version
          '
          docker rm -f fenix-prov

      - name: Verify provisioning is non-fatal (bad tool must not crash the container)
        run: |
          set -ex
          printf '%s\n' '[tools]' 'uv = "latest"' '' '[env]' 'EXTRA_TOOLS = "definitely-not-a-tool"' > /tmp/ci-mise-bad.toml
          docker run -d --name fenix-bad \
            -e GIT_USER_NAME="CI" \
            -e GIT_USER_EMAIL="ci@test" \
            -v "/tmp/ci-mise-bad.toml:/home/dev/mise.toml:ro" \
            fenix-base:ci
          for i in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Running}}' fenix-bad)" = "true" && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Running}}' fenix-bad)" = "true"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' fenix-bad)" = "true"
          docker exec fenix-bad bash -lc '
            set -ex
            test -f "$HOME/.provisioned/last-run.log"
            test -f "$HOME/.provisioned/status"
            grep -q "extra-tool: definitely-not-a-tool: unknown" "$HOME/.provisioned/last-run.log"
            grep -q "extra-tools: summary" "$HOME/.provisioned/last-run.log"
            grep -q "provision: summary" "$HOME/.provisioned/last-run.log"
          '
          docker rm -f fenix-bad

      - name: Trivy scan (base)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fenix-base:ci
          format: sarif
          output: trivy-base.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy SARIF (base)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-base.sarif
          category: trivy-base

  verify-example:
    needs: changes
    if: needs.changes.outputs.example == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/verify-example.yml

  ci-ok:
    if: always()
    needs: [changes, validate-config, build, verify-example]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
