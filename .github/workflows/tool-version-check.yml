name: tool-version-check

# Daily check that each pinned tool version in the repo matches the latest
# upstream release. For each tool that lags, .github/scripts/bump-tools.sh
# maintains a SINGLE self-updating pull request on a fixed branch
# (automation/bump-<tool>): a newer release before merge rewrites the same
# branch/PR rather than opening another, so stale bump PRs never pile up. The
# script bumps version/checksum pins only and never touches a trust anchor.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to check (default: all)"
        type: string
        default: all
      check_only:
        description: "Only report the comparison; do not open/update a PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tool-version-check
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fixed bump branches
      pull-requests: write # open/update the bump PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base branch to reset the bump branches

      - name: Check pinned tool versions and maintain the bump PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_only) && '1' || '' }}
        run: ./.github/scripts/bump-tools.sh "${{ (github.event_name == 'workflow_dispatch' && inputs.tool) || 'all' }}"
