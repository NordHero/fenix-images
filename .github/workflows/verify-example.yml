name: verify-example

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-example:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build base image (fenix-base:local)
        run: ./build-images.sh

      - name: Start the example capsule
        working-directory: example
        run: |
          set -ex
          docker compose up -d
          docker compose ps

      - name: Wait for the container to be healthy
        working-directory: example
        run: |
          set -ex
          cid="$(docker compose ps -q dev)"
          test -n "$cid"
          for i in $(seq 1 30); do
            h="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
            echo "health=$h"
            test "$h" = "healthy" && break
            test "$h" = "unhealthy" && { echo "container unhealthy"; exit 1; }
            sleep 4
          done
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true"

      - name: Install the declared toolset
        working-directory: example
        run: |
          set -ex
          docker compose exec -T \
            -e MISE_FETCH_REMOTE_VERSIONS_TIMEOUT=120s \
            -e MISE_HTTP_TIMEOUT=120s \
            dev bash -lc '
            set -ex
            mise trust "$HOME/mise.toml"
            eval "$(mise activate bash)"
            mise ls --current
            # Retry to absorb transient registry/proxy timeouts; mise install
            # is idempotent.
            n=0
            until mise install --yes; do
              n=$((n+1))
              test "$n" -ge 3 && { echo "mise install failed after $n attempts"; exit 1; }
              echo "mise install attempt $n failed; retrying"
              sleep 10
            done
          '

      - name: Assert every declared tool resolves and runs
        working-directory: example
        run: |
          set -ex
          docker compose exec -T dev bash -lc '
            set -ex
            eval "$(mise activate bash)"

            # Every pinned [tools] entry must resolve to an installed version;
            # a non-empty --missing list is a failure.
            mise ls --current --missing | tee /tmp/missing.txt
            test ! -s /tmp/missing.txt

            # Smoke-run the declared tool.
            uv --version
          '

      - name: Copy installed tools out of the home volume
        working-directory: example
        run: |
          set -ex
          cid="$(docker compose ps -q dev)"
          mkdir -p "$RUNNER_TEMP/mise-tools"
          docker cp "$cid:/home/dev/.local/share/mise/installs" "$RUNNER_TEMP/mise-tools/installs"
          # ~/.local/bin only exists if a tool installs into it (e.g. an
          # EXTRA_TOOLS vendor install); the minimal uv-only example has none.
          docker cp "$cid:/home/dev/.local/bin" "$RUNNER_TEMP/mise-tools/bin" || true
          du -sh "$RUNNER_TEMP/mise-tools"

      - name: Trivy scan (mise tools)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/mise-tools
          format: sarif
          output: trivy-mise-tools.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          timeout: 20m

      - name: Upload Trivy SARIF (mise tools)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-mise-tools.sarif
          category: trivy-mise-tools

      - name: Tear down
        if: always()
        working-directory: example
        run: docker compose down -v || true
