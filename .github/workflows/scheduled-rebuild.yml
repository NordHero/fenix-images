name: scheduled-rebuild

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Rebuild base image without cache
        run: |
          docker build --no-cache --pull \
            --build-arg "IMAGE_VERSION=rebuild" \
            --build-arg "SOURCE_COMMIT=$(git rev-parse --short HEAD)" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t fenix-base:rebuild .

      - name: Verify base image contents + non-root
        run: |
          docker run --rm --entrypoint bash fenix-base:rebuild -lc '
            set -ex
            test "$(id -u)" -eq 1000
            git --version
            gh --version
            zsh --version
            mise --version
            bwrap --version
            socat -V >/dev/null
            test -d /opt/devbox-skel/.oh-my-zsh
            test -d /opt/devbox-skel/.oh-my-zsh-custom/themes/powerlevel10k
          '

      - name: Trivy scan (base)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fenix-base:rebuild
          format: sarif
          output: trivy-rebuild.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy SARIF (rebuild)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-rebuild.sarif
          category: trivy-rebuild

