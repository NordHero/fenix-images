name: scheduled-rebuild

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Rebuild base image without cache
        run: |
          docker build --no-cache --pull \
            --build-arg "IMAGE_VERSION=rebuild" \
            --build-arg "SOURCE_COMMIT=$(git rev-parse --short HEAD)" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t fenix-base:rebuild .

      - name: Verify base image contents + non-root
        run: |
          docker run --rm --entrypoint bash fenix-base:rebuild -lc '
            set -ex
            test "$(id -u)" -eq 1000
            git --version
            gh --version
            zsh --version
            mise --version
            test -d /opt/devbox-skel/.oh-my-zsh
            test -d /opt/devbox-skel/.oh-my-zsh-custom/themes/powerlevel10k
          '

      - name: Trivy scan (base)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fenix-base:rebuild
          format: sarif
          output: trivy-rebuild.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF (rebuild)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-rebuild.sarif
          category: trivy-rebuild

