name: close-external-prs

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --comment "Thanks for your interest. This repository does not accept external contributions, so this pull request was closed automatically. Report security issues privately via Security > Report a vulnerability; see CONTRIBUTING.md."
